# Full stack for multi-tenant / high-traffic runs:
#   postgres + redis + migrate (one-shot) + api + N arq workers.
#
# Scale the background workers horizontally (they all pull the same Redis queue):
#   docker compose up -d --scale worker=6
# Scale the API (stateless) behind your load balancer the same way:
#   docker compose up -d --scale api=3      # (drop the api host port mapping first)

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/zatca
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: change-me-in-prod
  ZATCA_SANDBOX_BASE_URL: https://gw-fatoora.zatca.gov.sa/e-invoicing/developer-portal
  ZATCA_SIMULATION_BASE_URL: https://gw-fatoora.zatca.gov.sa/e-invoicing/simulation
  ZATCA_PRODUCTION_BASE_URL: https://gw-fatoora.zatca.gov.sa/e-invoicing/core

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: zatca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zatca"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # Persist the queue so in-flight jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot DB migration. api + worker wait for this to finish.
  migrate:
    build: ./backend
    environment: *backend-env
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      <<: *backend-env
      # The dedicated worker owns the queue schedule — never tick in the API,
      # especially with --workers > 1 / multiple api replicas.
      ENABLE_INPROC_TICK: "false"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 4
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Background submitters. Stateless — scale with --scale worker=N.
  worker:
    build: ./backend
    environment: *backend-env
    command: arq app.workers.arq_worker.WorkerSettings
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: {}
  redisdata: {}
